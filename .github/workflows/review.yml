name: Claude review

# Claude reviews every pull request and leaves inline comments on problems.
# Runs on GitHub-hosted runners only (never on the Pi's self-hosted runner).
# Pull requests from forks are skipped: they don't get the repo's secrets.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read CLAUDE.md and docs/development.md first:
            they set the project's rules (layering, enums, callback data that must
            never change, docs kept up to date).

            On a new push to a PR you already reviewed, review only what changed
            and don't repeat comments that are still open.

            Look for, most important first:
            - Bugs: wrong behaviour, edge cases, crashes, timezone and date mistakes
            - Database: migrations that lose data or can't run on the existing schema
            - Security: secrets in code, unchecked input
            - Breaking the project's rules from CLAUDE.md
            - Missing tests for new behaviour, and docs not updated

            Leave one inline comment per real problem, on the line it's about, saying
            what goes wrong and how to fix it. Skip style nitpicks and praise.
            Finish with one short top-level comment with `gh pr comment`: either
            "No problems found." or the number of problems and the most serious one.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
