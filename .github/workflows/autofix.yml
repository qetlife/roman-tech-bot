name: Auto-fix failed messages

# Daily on the Pi, where the failed messages are: Claude opens a pull request
# teaching the bot the ones it can learn (autofix/run.py). Only a schedule or
# a manual run starts it, never a pull request, so nobody else can run code
# on the Pi through it.
on:
  schedule:
    - cron: "0 3 * * *"     # 04:00 in Lisbon in summer, 03:00 in winter
  workflow_dispatch:

concurrency: autofix

permissions:
  contents: read

jobs:
  autofix:
    runs-on: [self-hosted, roman-tech-bot]
    timeout-minutes: 180     # run.py starts no Claude run after 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run the auto-fix job
        env:
          GH_TOKEN: ${{ secrets.AUTOFIX_GH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 autofix/run.py
