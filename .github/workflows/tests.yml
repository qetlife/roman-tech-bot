name: Tests

# Runs on GitHub-hosted runners only (never on the Pi's self-hosted runner),
# so running it for pull requests from anyone is safe.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check for undefined names and unused imports
        # alembic/ is skipped: env.py imports model modules only to register them.
        run: python -m pyflakes bot.py config.py enums.py core db handlers jobs scripts services tests autofix

      - name: Run tests
        run: python -m pytest -q
