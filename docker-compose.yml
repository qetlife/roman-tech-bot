services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      # Telegram bot token (required)
      BOT_TOKEN: ${BOT_TOKEN}
      # SQLAlchemy URL of the PostgreSQL database, read from the shell or .env
      # e.g. postgresql+psycopg://roman_tech_bot:<password>@postgres:5432/roman_tech_bot
      DB_CONNECTION: ${DB_CONNECTION}
      # speech-service for voice messages, e.g. http://speech:8000 (optional)
      SPEECH_URL: ${SPEECH_URL:-}
      SPEECH_TOKEN: ${SPEECH_TOKEN:-}
      # Telegram user ID of the admin, who can see /failed (optional)
      ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:-}
      # Google Calendar sync (optional; all four, see docs/setup.md)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      CALENDAR_KEY: ${CALENDAR_KEY:-}
      # The web app's address, e.g. https://app.romanis.xyz (optional, docs/setup.md)
      WEBAPP_URL: ${WEBAPP_URL:-}
    volumes:
      # Unexpected errors (errors.jsonl, at most 25 MB): kept across deploys, read with
      # docker compose exec bot python scripts/errors.py list
      - errors:/app/data/errors
    # Docker's own log (stdout): at most 3 files of 10 MB
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      # Shared with the `postgres` container, and with `cloudflared`, which sends
      # calendar.romanis.xyz and app.romanis.xyz to the bot's web server as
      # roman-tech-bot:8080 (Google Calendar, the web app; docs/setup.md). Not published on the Pi.
      shared-network:
        aliases:
          - roman-tech-bot

networks:
  shared-network:
    external: true

volumes:
  errors:
