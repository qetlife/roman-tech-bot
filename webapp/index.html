<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Assistant</title>
  <link rel="stylesheet" href="style.css">
  <!-- Inside Telegram: who the user is (initData), light or dark, haptics -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <button id="top" class="brand" type="button" title="Back to the top">
      <span class="mark" aria-hidden="true"><span></span></span>
      <span>Assistant</span>
    </button>
    <button id="week" class="icon" type="button" aria-label="The next 7 days" hidden></button>
    <button id="sound" class="icon" type="button" aria-label="Spoken replies" aria-pressed="true"></button>
  </header>

  <!-- In a browser: log in with Telegram -->
  <section id="login" hidden>
    <p>Log in with Telegram to talk to your assistant.</p>
    <div id="widget"></div>
    <p id="login-error" class="error" hidden></p>
  </section>

  <main id="main" hidden>
    <section id="home">
      <h1 id="greeting">Hello.</h1>
      <p class="sub" id="today-date"></p>
      <div id="briefing" class="panel" aria-live="polite"></div>
      <h2 class="label">What I can do</h2>
      <div id="skills" class="skills"></div>
    </section>
    <ol id="turns" aria-live="polite"></ol>
  </main>

  <section id="week-sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="week-title">
      <div class="sheet-head">
        <h2 id="week-title">The next 7 days</h2>
        <button id="week-close" class="icon" type="button" aria-label="Close"></button>
      </div>
      <div id="days"></div>
    </div>
  </section>

  <footer id="composer" hidden>
    <div class="bar">
      <form id="send">
        <label class="sr" for="text">Ask or tell me</label>
        <input id="text" autocomplete="off" placeholder="Ask me anything…" enterkeyhint="send">
        <button id="send-button" class="icon" type="submit" aria-label="Send"></button>
      </form>
      <button id="mic" type="button" aria-label="Hold to talk" title="Hold to talk"></button>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
