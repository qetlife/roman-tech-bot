<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reminders</title>
  <link rel="stylesheet" href="style.css">
  <!-- Inside Telegram: who the user is (initData), the theme, haptics -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header>
    <nav>
      <button class="tab active" data-tab="chat">💬 Chat</button>
      <button class="tab" data-tab="upcoming">📅 Upcoming</button>
    </nav>
    <button id="sound" title="Spoken replies" aria-pressed="true">🔊</button>
  </header>

  <!-- In a browser: log in with Telegram -->
  <section id="login" hidden>
    <p>Log in with Telegram to see your reminders and talk to the bot.</p>
    <div id="widget"></div>
    <p id="login-error" class="error" hidden></p>
  </section>

  <main id="chat" hidden>
    <ol id="messages" aria-live="polite"></ol>
  </main>

  <main id="upcoming" hidden>
    <div id="days"></div>
  </main>

  <footer id="composer" hidden>
    <form id="send">
      <input id="text" autocomplete="off" placeholder="remind me tomorrow at 9 to call mom" enterkeyhint="send">
      <button id="send-button" type="submit" title="Send">➤</button>
    </form>
    <button id="mic" title="Hold to talk">🎙</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
